name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # Stable branch-protection status check.
  gate:
    name: gate
    if: ${{ always() }}
    needs:
      - checks
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: test "${{ needs.checks.result }}" = "success"
